name: Loot monitor

# Free on a PUBLIC repository (standard runners cost nothing there). On a private
# repository this schedule would use far more than the free monthly minutes.

on:
  # Every 5 minutes is the shortest schedule GitHub allows, and runs can start late when
  # GitHub is busy. That is why each run keeps scanning for nearly five minutes (one scan
  # per minute) instead of looking once and leaving.
  # To pause the monitor: Actions tab -> Loot monitor -> "..." -> Disable workflow.
  #
  # GitHub's scheduler sometimes does not start runs at all (new repositories especially).
  # For that case there is a switch, off by default: set the repository variable KEEP_RUNNING
  # to 1 (Settings -> Secrets and variables -> Actions -> Variables) and start one run by hand.
  # From then on every run starts the next one when it ends. Set it back to 0 to stop.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = scan now | doctor = report which sources work (doctor-detail lists every post) | test-ntfy = send one test push"
        type: choice
        default: run
        options: [run, doctor, doctor-detail, test-ntfy]
      watchlist_file:
        description: "Page list to use (default watchlist.txt; the -try files hold candidates that are only being tested)"
        type: string
        default: watchlist.txt
      channels_file:
        description: "Channel list to use (default channels.txt)"
        type: string
        default: channels.txt
      feeds_file:
        description: "Feed list to use (default feeds.txt)"
        type: string
        default: feeds.txt

permissions:
  contents: read
  actions: write # only used to delete this workflow's own older state caches

# Scanning runs take turns (one running, one waiting). Checks (doctor, test push) store nothing,
# so each gets a lane of its own and never pushes a waiting scan out of the queue.
concurrency:
  group: ${{ (inputs.mode || 'run') == 'run' && 'loot-monitor' || format('loot-check-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'run' }}
      # Secrets (Settings -> Secrets and variables -> Actions -> Secrets)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_HEALTH_TOPIC: ${{ secrets.NTFY_HEALTH_TOPIC }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      # Optional tuning (same page -> Variables). Anything left unset uses the built-in default.
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT }}
      HIGH_DISCOUNT: ${{ vars.HIGH_DISCOUNT }}
      URGENT_DISCOUNT: ${{ vars.URGENT_DISCOUNT }}
      MIN_SAVING: ${{ vars.MIN_SAVING }}
      URGENT_MIN_SAVING: ${{ vars.URGENT_MIN_SAVING }}
      BIG_SAVING: ${{ vars.BIG_SAVING }}
      LOOT_PRICE: ${{ vars.LOOT_PRICE }}
      FLOOR_MRP_RATIO: ${{ vars.FLOOR_MRP_RATIO }}
      NEW_LISTING_DISCOUNT: ${{ vars.NEW_LISTING_DISCOUNT }}
      WATCH_DROP_PCT: ${{ vars.WATCH_DROP_PCT }}
      URGENT_DROP_PCT: ${{ vars.URGENT_DROP_PCT }}
      MAX_POST_AGE_MIN: ${{ vars.MAX_POST_AGE_MIN }}
      LATE_POST_MIN: ${{ vars.LATE_POST_MIN }}
      DAILY_ALERT_LIMIT: ${{ vars.DAILY_ALERT_LIMIT }}
      HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR }}
      EXTRA_STORE_DOMAINS: ${{ vars.EXTRA_STORE_DOMAINS }}
      USE_CHANNELS: ${{ vars.USE_CHANNELS }}
      USE_STORE_PAGES: ${{ vars.USE_STORE_PAGES }}
      LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '280' }}
      WATCHLIST_FILE: ${{ inputs.watchlist_file || 'watchlist.txt' }}
      CHANNELS_FILE: ${{ inputs.channels_file || 'channels.txt' }}
      FEEDS_FILE: ${{ inputs.feeds_file || 'feeds.txt' }}
      DB_PATH: state/lootwatch.db
    steps:
      - name: Note the start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          pip install --quiet -r requirements.txt -r requirements-optional.txt
          mkdir -p state

      # What has already been seen and alerted travels from run to run in the Actions cache.
      # It holds no secrets: the ntfy topic and token are never written to it.
      - name: Restore state
        if: env.MODE == 'run'
        uses: actions/cache/restore@v6
        with:
          path: state
          key: lootwatch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lootwatch-state-

      # The scan ends with an error when an alert could not be delivered through ntfy for half an
      # hour (a wrong token, ntfy unreachable). GitHub then marks the run as failed, which is the
      # one way a run can get itself noticed.
      - name: Scan
        run: |
          case "$MODE" in
            doctor) python -m lootwatch --doctor ;;
            doctor-detail) python -m lootwatch --doctor --verbose ;;
            test-ntfy) python -m lootwatch --test-ntfy ;;
            *) python -m lootwatch --max-runtime "$LOOP_SECONDS" ;;
          esac

      - name: Save state
        if: always() && env.MODE == 'run'
        uses: actions/cache/save@v6
        with:
          path: state
          key: lootwatch-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove older state caches
        if: always() && env.MODE == 'run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key lootwatch-state- --sort created_at --order desc \
            --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n 1 gh cache delete --repo "$GITHUB_REPOSITORY"

      # Only with KEEP_RUNNING=1 (see the top of this file). Not after a cancelled run, so
      # cancelling a run stops the chain. A run that ended early waits out its five minutes
      # first: a broken run must never turn into a rapid loop.
      - name: Start the next run
        if: ${{ !cancelled() && env.MODE == 'run' && vars.KEEP_RUNNING == '1' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$elapsed" -lt 270 ]; then sleep $(( 270 - elapsed )); fi
          gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=run
