name: Loot monitor
run-name: ${{ (inputs.mode || 'run') == 'run' && 'Loot scan' || format('Loot check ({0})', inputs.mode) }}

# Free on a PUBLIC repository (standard runners cost nothing there). On a private
# repository this would use far more than the free monthly minutes.

on:
  # HOW IT KEEPS RUNNING
  # Set the repository variable KEEP_RUNNING to 1 (Settings -> Secrets and variables -> Actions ->
  # Variables) and start one run by hand (Actions -> Loot monitor -> Run workflow). From then on
  # each run scans for a quarter of an hour, starts the next run shortly before its time is up,
  # and leaves only once that run stands ready (deploy/relay.sh). There is always one run on duty.
  #
  # The schedule below is the safety net: GitHub starts scheduled runs late or not at all (new
  # repositories especially), so it cannot carry the monitor, but it restarts the runs if they
  # ever stop. Without KEEP_RUNNING the schedule is all there is, and scanning has gaps.
  #
  # TO STOP: Actions -> Loot monitor -> "..." -> Disable workflow, then cancel the run in progress.
  # (Setting KEEP_RUNNING to 0 only stops the runs from starting each other: the schedule still
  # starts a run whenever GitHub gets round to it.)
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = scan | doctor = report which sources work (doctor-detail lists every post) | test-ntfy = send three test pushes (quiet, high, urgent)"
        type: choice
        default: run
        options: [run, doctor, doctor-detail, test-ntfy]
      watchlist_file:
        description: "Page list to use (default watchlist.txt)"
        type: string
        default: watchlist.txt
      channels_file:
        description: "Channel list to use (default channels.txt)"
        type: string
        default: channels.txt
      feeds_file:
        description: "Feed and deal-site list to use (default feeds.txt)"
        type: string
        default: feeds.txt
      hops:
        description: "Test branches only (ignored on main): how many more runs this run may start"
        type: string
        default: ""
      shift_seconds:
        description: "Test branches only (ignored on main): length of a shift in seconds"
        type: string
        default: ""

permissions:
  contents: read
  actions: write # start the next run, cancel a run that never got going, delete older state caches

# No concurrency group: the next run must be able to get ready while this one is still scanning.
# The runs take turns through deploy/relay.sh instead.

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODE: ${{ inputs.mode || 'run' }}
      # Secrets (Settings -> Secrets and variables -> Actions -> Secrets)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_HEALTH_TOPIC: ${{ secrets.NTFY_HEALTH_TOPIC }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      # Optional tuning (same page -> Variables). Anything left unset uses the built-in default.
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT }}
      HIGH_DISCOUNT: ${{ vars.HIGH_DISCOUNT }}
      URGENT_DISCOUNT: ${{ vars.URGENT_DISCOUNT }}
      MIN_SAVING: ${{ vars.MIN_SAVING }}
      URGENT_MIN_SAVING: ${{ vars.URGENT_MIN_SAVING }}
      BIG_SAVING: ${{ vars.BIG_SAVING }}
      LOOT_PRICE: ${{ vars.LOOT_PRICE }}
      FLOOR_MRP_RATIO: ${{ vars.FLOOR_MRP_RATIO }}
      NEW_LISTING_DISCOUNT: ${{ vars.NEW_LISTING_DISCOUNT }}
      WATCH_DROP_PCT: ${{ vars.WATCH_DROP_PCT }}
      URGENT_DROP_PCT: ${{ vars.URGENT_DROP_PCT }}
      TRACKER_DROP_PCT: ${{ vars.TRACKER_DROP_PCT }}
      QUICK_COUPON_PCT: ${{ vars.QUICK_COUPON_PCT }}
      QUICK_LOOTS: ${{ vars.QUICK_LOOTS }}
      MAX_POST_AGE_MIN: ${{ vars.MAX_POST_AGE_MIN }}
      LATE_POST_MIN: ${{ vars.LATE_POST_MIN }}
      DAILY_ALERT_LIMIT: ${{ vars.DAILY_ALERT_LIMIT }}
      HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR }}
      EXTRA_STORE_DOMAINS: ${{ vars.EXTRA_STORE_DOMAINS }}
      SITE_GAPS: ${{ vars.SITE_GAPS }}
      USE_CHANNELS: ${{ vars.USE_CHANNELS }}
      USE_STORE_PAGES: ${{ vars.USE_STORE_PAGES }}
      DB_PATH: state/lootwatch.db
      # On main the runs follow the repository's settings and the shipped lists, whatever a
      # hand-started run was given: a run takes its place in the chain and hands its settings on,
      # so a test value typed into "Run workflow" would stick for good. Checks (doctor) may name
      # other lists anywhere. On any other branch a scan is a dry run: nothing reaches a phone,
      # and runs start each other only when "hops" says how often.
      LOOP_SECONDS: ${{ github.ref != 'refs/heads/main' && inputs.shift_seconds || vars.LOOP_SECONDS || '840' }}
      SHIFT_SECONDS_INPUT: ${{ github.ref != 'refs/heads/main' && inputs.shift_seconds || '' }}
      WATCHLIST_FILE: ${{ (github.ref != 'refs/heads/main' || (inputs.mode || 'run') != 'run') && inputs.watchlist_file || 'watchlist.txt' }}
      CHANNELS_FILE: ${{ (github.ref != 'refs/heads/main' || (inputs.mode || 'run') != 'run') && inputs.channels_file || 'channels.txt' }}
      FEEDS_FILE: ${{ (github.ref != 'refs/heads/main' || (inputs.mode || 'run') != 'run') && inputs.feeds_file || 'feeds.txt' }}
      KEEP_RUNNING: ${{ github.ref == 'refs/heads/main' && vars.KEEP_RUNNING || github.ref != 'refs/heads/main' && inputs.hops != '' && '1' || '' }}
      RELAY_HOPS: ${{ github.ref != 'refs/heads/main' && inputs.hops || '' }}
      DRY_RUN: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          pip install --quiet -r requirements.txt -r requirements-optional.txt
          mkdir -p state

      # A scheduled run is not needed while the runs keep each other going, and a third run is not
      # needed while one scans and one waits. Decided here, in a step of its own: a run that is
      # about to leave must never look like one that stands ready to take over.
      - name: Am I needed?
        id: need
        if: env.MODE == 'run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/relay.sh check

      # Only one run scans at a time. This one is ready now and waits here until the run before
      # it has saved its state and gone.
      - name: Wait for my turn
        if: env.MODE == 'run' && steps.need.outputs.surplus != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/relay.sh wait

      # What has already been seen and alerted travels from run to run in the Actions cache.
      # It holds no secrets: the ntfy topic and token are never written to it.
      - name: Restore state
        id: restore
        if: env.MODE == 'run' && steps.need.outputs.surplus != '1'
        uses: actions/cache/restore@v6
        with:
          path: state
          key: lootwatch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lootwatch-state-

      # Done before the scan, so that nothing but saving the state stands between this run's
      # last scan and the next run's first.
      - name: Remove older state caches
        if: env.MODE == 'run' && steps.need.outputs.surplus != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key lootwatch-state- \
            --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n 1 gh cache delete --repo "$GITHUB_REPOSITORY"

      # The scan ends with an error when an alert could not be delivered through ntfy for half an
      # hour (a wrong token, ntfy unreachable), and when the scanner crashed and had to be started
      # again. GitHub then marks the run as failed, which is the one way a run can get itself
      # noticed. The next run is started all the same.
      - name: Scan
        if: steps.need.outputs.surplus != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$MODE" in
            doctor) python -m lootwatch --doctor ;;
            doctor-detail) python -m lootwatch --doctor --verbose ;;
            test-ntfy) python -m lootwatch --test-ntfy ;;
            *) bash deploy/relay.sh shift ;;
          esac

      # Only a run that restored the state and has a state file may save one: a run cancelled
      # while it waited has nothing but an empty folder, and that must not become the newest state.
      - name: Save state
        if: always() && env.MODE == 'run' && steps.restore.conclusion == 'success' && hashFiles('state/lootwatch.db') != ''
        uses: actions/cache/save@v6
        with:
          path: state
          key: lootwatch-state-${{ github.run_id }}-${{ github.run_attempt }}
